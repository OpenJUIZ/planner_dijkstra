# planner_dijkstra の起動設定
#   先に mobile_sim を IPC 名 mobile_sim で動かしておく(juiz run mobile_sim、または juiz -f app.conf -d --ipc mobile_sim)
#   開発中: scripts/dev_plugin.sh でプラグインを app/plugins/<target>/ に置いてから
#           cd app && juiz -f app.conf -d
#   ロボットの姿勢をトピック amcl_pose(Pose2DStamped。localization_amcl が出す)で、目標をトピック goal(Pose2DStamped)で受け、
#   ダイクストラ法で求めた経路をトピック path に出す。画面(http://localhost:8003/)からは地図をクリックして目標を置ける
"name": "planner_dijkstra"
"option":
  "http_broker":
    "start": true
    "port": 8003
    # ブラウザ画面(conf のディレクトリからの相対)
    "static_filepaths":
      "/": "web"
# ほかの System からトピックを受けるため、こちらも IPC ブローカーを持つ
"brokers":
  - "type_name": "ipc"
    "name": "planner_dijkstra"
# mobile_sim につなぐ(画面が地図と真の姿勢を使う)。package を書くと、juiz run は juizapp.yaml の depends の mobile_sim としてこれを使い、版を確かめる
# (別の機械の mobile_sim を使うときは juiz run --depend mobile_sim=http://<host>:8000)
"subsystems":
  - "package": "mobile_sim"
    "type_name": "ipc"
    "name": "mobile_sim"
"plugins":
  "components":
    "planner_dijkstra":
      "language": "rust"
      "path": "plugins/{target}"
"containers":
  - "type_name": "dijkstra_planner"
    "name": "planner0"
    # 地図(ROS map_server の YAML。mobile_sim の既定の地図と同じもの)。相対パスは JUIZ_APP_DIR(juiz run の展開先)、無ければカレントディレクトリから。
    # 環境変数 PLANNER_MAP があればそちらを使う。あとから planner_load_map・planner_set_map(画面の「mobile_sim の地図を使う」)で差し替えられる
    "map": "assets/maps/default.yaml"
    # 経路の header.frame_id
    "frame_id": "map"
    # 不明の格子を通ってよいか
    "allow_unknown": false
    # 斜めにも進むか(false なら上下左右だけ)
    "diagonal": true
    "processes":
      # ロボットの姿勢を覚える。localization_amcl の推定位置(map 座標系)を受ける
      - "type_name": "planner_set_start"
        "name": "set_start0"
        "use_memo": false
        "subscribes":
          "pose": "amcl_pose"
      # 目標を受けて、覚えた姿勢から経路を求め、トピック path に出す
      - "type_name": "planner_set_goal"
        "name": "set_goal0"
        "use_memo": false
        "subscribes":
          "goal": "goal"
        "publishes":
          - "path"
      # 出発と目標を両方渡して経路を求め、トピック path に出す(画面で AMCL が無いときに mobile_sim の真の姿勢から求める)
      - "type_name": "planner_plan"
        "name": "plan0"
        "use_memo": false
        "publishes":
          - "path"
      - "type_name": "planner_get_path"
        "name": "get_path0"
        "use_memo": false
      - "type_name": "planner_set_map"
        "name": "set_map0"
        "use_memo": false
      - "type_name": "planner_load_map"
        "name": "load_map0"
        "use_memo": false
      - "type_name": "planner_get_map"
        "name": "get_map0"
      - "type_name": "planner_get_map_info"
        "name": "get_map_info0"
        "use_memo": false
      - "type_name": "planner_get_state"
        "name": "get_state0"
        "use_memo": false
