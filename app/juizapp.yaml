# .juizapp のマニフェスト(juiz docs/spec/app-package.md §4)。languages・targets・rust・files は juiz pack が書き足す
format: 1
name: planner_dijkstra
version: 0.2.0
kind: app
description: "Global path planner: Dijkstra on the occupancy grid map from the robot pose to a goal (works with mobile_sim)"
license: MIT OR Apache-2.0
homepage: https://github.com/OpenJUIZ/planner_dijkstra
# C ABI の Rust プラグインなので、その ABI を読める juiz(Cargo.toml の juiz_sdk と同じ版以降)なら rustc は問わない
juiz: ">=0.2.4"
entry: app.conf
# 画面が mobile_sim の地図・真の姿勢を使う。juiz run が ipc://mobile_sim を subsystem に足して版を確かめる
depends:
  mobile_sim: ">=0.3.1, <0.4"
